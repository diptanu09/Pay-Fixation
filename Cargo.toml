[workspace]
resolver = "2"
members = [
    "crates/payfix-domain",
    "crates/payfix-rules",
    "crates/payfix-calculation",
    "crates/payfix-pension",
    "crates/payfix-pay-fixation",
    "crates/payfix-service",
    "crates/payfix-dcrg",
    "crates/payfix-commutation",
    "crates/payfix-revision",
    "crates/payfix-reports",
    "tools/excel-importer",
    "tools/payfix-excel-forensics",
    "tools/release-certifier",
    "services/payfix-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PAYFIX Engineering Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde-float"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.39", features = ["full"] }
tracing = "0.1"
calamine = "0.26"
sha2 = "0.10"
