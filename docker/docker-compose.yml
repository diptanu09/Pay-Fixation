services:
  payfix-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - DATABASE_URL=postgres://postgres:root@123@host.docker.internal:5432/Pay-Fixation
      - RUST_LOG=info,payfix_api=debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  payfix-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:80"
    restart: always
